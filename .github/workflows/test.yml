name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Tessel is a Windows app: node-pty ships a win32-x64 prebuild, and the
    # specs check Windows paths, shells and the askpass/cli launchers.
    runs-on: windows-latest
    # npm ci downloads no Electron binary (electron 42 fetches it on first
    # use, and no spec loads the real electron).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Electron 42's Node (24.x). Node 22 has no inline regexp modifiers
          # ("(?-i:C)" in the default git rules): their case-insensitive form,
          # the one PowerShell commands are matched with, never matched there.
          node-version: 24
          cache: npm

      # .npmrc (legacy-peer-deps) is read from the repo: electron-vite 5 caps
      # its Vite peer at ^7 while we run Vite 8.
      - run: npm ci

      # The runner's TEMP is an 8.3 short path (C:\Users\RUNNER~1\...): specs
      # that compare a temp folder with its real path (accounts, worktrees,
      # review, agent state) fail there and nowhere else. A long one instead.
      - name: Long temp path
        shell: pwsh
        run: |
          $t = Join-Path $env:RUNNER_TEMP 'tmp'
          New-Item -ItemType Directory -Force $t | Out-Null
          "TEMP=$t" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TMP=$t" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # The tessel-host client (src/main/host) is TypeScript, strict.
      - run: npm run typecheck:host

      - run: npx vitest run
