<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Nothing leaves this page: no network call of any kind (connect-src), no frame,
         no form, only the page's own scripts, as in Tessel's real window. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'none'; worker-src 'self' blob:; font-src 'self' data:; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none';"
    />
    <meta name="robots" content="noindex" />
    <!-- No icon to ask for: the site's own page has it. -->
    <link rel="icon" href="data:," />
    <title>Tessel</title>
  </head>
  <body>
    <!-- Shown until the app mounts (Vue replaces it): the icon on the app's background,
         as in src/renderer/index.html. -->
    <div id="app">
      <div style="position: fixed; inset: 0; display: grid; place-items: center; background: #101216">
        <svg width="56" height="56" viewBox="0 0 24 24" aria-hidden="true" style="opacity: 0.9">
          <rect x="3" y="3" width="5" height="5" rx="1.2" fill="#6b8fff" />
          <rect x="9.5" y="3" width="5" height="5" rx="1.2" fill="#6b8fff" />
          <rect x="16" y="3" width="5" height="5" rx="1.2" fill="#6b8fff" />
          <rect x="9.5" y="9.5" width="5" height="5" rx="1.2" fill="#5e78d4" />
          <rect x="9.5" y="16" width="5" height="5" rx="1.2" fill="#44589b" />
          <rect x="16" y="16" width="5" height="5" rx="1.2" fill="#e6e6e6" />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
